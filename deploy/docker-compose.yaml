name: ${APP_NAME:-jungo}

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      target: prod
    ports:
      - "${API_SERVER_PORT:-8080}:${API_SERVER_PORT:-8080}"
    env_file:
      - ../.env
    volumes:
      - storage:/app/storage
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-go_api_framework}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  redis:
    image: redis:7-alpine
    profiles: ["cache", "full"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

volumes:
  postgres_data:
  storage:

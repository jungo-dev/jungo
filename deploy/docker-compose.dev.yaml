name: ${APP_NAME:-jungo}-dev

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
      target: dev
    ports:
      - "${API_SERVER_PORT:-8080}:${API_SERVER_PORT:-8080}"
    env_file:
      - ../.env
    volumes:
      - ..:/app
      - go-pkg-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      postgresql:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M
          cpus: "2.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_SERVER_PORT:-8080}/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-jungo}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"

  # Enable with: make app-dev WITH=cache
  redis:
    image: redis:7-alpine
    profiles: ["cache", "full"]
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # Enable with: make app-dev WITH=mail (for a local Telegram-alert stand-in / SMTP testing)
  mailpit:
    image: axllent/mailpit
    profiles: ["mail", "full"]
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

volumes:
  postgres_data:
  go-pkg-cache:
  go-build-cache:
